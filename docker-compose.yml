# Everything needed to run this on a server:
#
#   cp .env.example .env     # then fill in the keys and set API_KEYS
#   docker compose up -d db
#   docker compose run --rm api alembic upgrade head
#   docker compose up -d api
#
# The scheduled work runs through the `jobs` service, which exits when finished:
#   docker compose run --rm jobs python -m app.pipeline.weekly
# See scripts/crontab.example for the schedule.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: fmep
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fmep"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published by default: only the containers need it. Uncomment to
    # inspect the database from the host.
    # ports: ["55432:5432"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    env_file: .env
    environment:
      # Inside the compose network the database is simply "db".
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/fmep
      ENVIRONMENT: production
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"   # bind locally; put a reverse proxy in front for TLS

  # One-shot container for the pipeline, backfills and backups. Shares the image
  # and the data volume, so a run leaves its log in data/logs as it does locally.
  jobs:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/fmep
      ENVIRONMENT: production
    volumes:
      - ./data:/app/data
    entrypoint: []
    command: ["python", "-m", "app.pipeline.weekly"]
    profiles: ["jobs"]   # never started by `up`; run explicitly

volumes:
  db-data:
