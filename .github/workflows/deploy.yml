name: Deploy

# Pushes the new code to the server and restarts it. The instance is reached
# through SSM, so nothing needs an open SSH port and no AWS keys are stored
# here: the workflow assumes an IAM role through GitHub's OIDC provider.
#
# It stays dormant until the repository variable EC2_INSTANCE_ID is set, so
# merges do not fail while there is no server yet.
#
# Needs: secret AWS_ROLE_ARN; variables AWS_REGION and EC2_INSTANCE_ID.

on:
  workflow_run:
    workflows: [Tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write      # to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy code that passed its tests, and only once a server exists.
    if: >
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      vars.EC2_INSTANCE_ID != ''

    steps:
      # What GitHub actually claims. The trust policy has to match these exactly,
      # and the error AWS returns when it does not is the same whatever the cause.
      - name: Show the identity GitHub is presenting
        run: |
          response=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          PAYLOAD=$(python3 -c "import json,sys; print(json.load(sys.stdin)['value'].split('.')[1])" <<<"$response")
          export PAYLOAD
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ["PAYLOAD"]
          raw += "=" * (-len(raw) % 4)
          claims = json.loads(base64.urlsafe_b64decode(raw))
          wanted = ("sub", "aud", "repository", "repository_owner", "ref", "event_name", "workflow")
          for key in wanted:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # The action tags the session by default, which the role would then
          # also have to allow (sts:TagSession). Nothing here reads those tags,
          # so it is simpler not to send them.
          role-skip-session-tagging: true

      - name: Pull, rebuild and restart on the instance
        id: send
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=[
              "set -euo pipefail",
              "cd /opt/fmep",
              "git fetch --all --prune",
              "git reset --hard origin/main",
              "docker compose build api",
              "docker compose run --rm api alembic upgrade head",
              "docker compose up -d api",
              "docker compose ps"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "sent $command_id"

      - name: Wait for it to finish, then show what happened
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "{status:Status,output:StandardOutputContent,error:StandardErrorContent}" \
            --output text
          status=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          test "$status" = "Success"
